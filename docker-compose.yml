services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: fourkeys
      POSTGRES_USER: fourkeys
      POSTGRES_PASSWORD: fourkeys
    volumes:
      - fourkeys_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fourkeys"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      FOURKEYS_DATABASE_URL: postgresql+psycopg2://fourkeys:fourkeys@db:5432/fourkeys
    env_file:
      - ./backend/.env
    volumes:
      # Eğitilmiş modeller (XGBoost/LSTM/online/regime/meta-label, bkz.
      # app/ml/artifacts/) `COPY . .` ile imaja gömülmüyor (.gitignore'da) —
      # bu named volume olmadan HER `docker build` (ör. recreate-backend.sh)
      # yeni bir boş image ile modelleri siliyordu. Artık container yeniden
      # oluşturulsa/rebuild edilse bile bu volume korunur, eğitimler kalıcı
      # olur ve otomatik yeniden eğitim (bkz. app.scheduler.jobs) yalnızca
      # veri hacmine göre gerektiğinde tetiklenir — her redeploy'da sıfırdan
      # değil.
      - fourkeys_ml_artifacts:/app/app/ml/artifacts
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    image: node:20-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - fourkeys_prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - fourkeys_grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  fourkeys_db_data:
  fourkeys_prometheus_data:
  fourkeys_grafana_data:
  fourkeys_ml_artifacts:
